name: Radar de Ofertas 24h

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  executar_bot:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rodar Radar de Ofertas
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py

    - name: Salvar ofertas enviadas no repositorio
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ofertas_enviadas.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizar ofertas enviadas [skip ci]" && git push)
