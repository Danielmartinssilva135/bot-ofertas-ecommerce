name: Radar de Ofertas 24h

on:
  schedule:
    # Roda a cada 2 horas em minutos quebrados (ex: minuto 17) para o GitHub nunca atrasar
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install requests

      - name: Executar Robô de Ofertas
        run: |
          python main.py

      - name: Salvar histórico de enviados no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historico_amazon.txt historico_mercadolivre.txt historico_shopee.txt || true
          git commit -m "Auto: Atualiza histórico de ofertas enviadas" || true
          git push || true
