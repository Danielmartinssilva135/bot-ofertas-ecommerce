name: Bot Ofertas E-commerce

on:
  schedule:
    # Executa a cada 1 hora de domingo a domingo
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executar-ofertas:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar bot de ofertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salvar histórico de ofertas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          
          # Cria os arquivos caso ainda não existam para evitar erro no git add
          touch historico_shopee.txt historico_amazon.txt historico_mercadolivre.txt
          
          git add historico_shopee.txt historico_amazon.txt historico_mercadolivre.txt
          git diff-index --quiet HEAD || (git commit -m "Auto: Atualiza histórico de ofertas enviadas [skip ci]" && git push origin main)
